<script>

function ziskatPolohu() {

const fromInput = document.getElementById("from");

const gpsStatus = document.getElementById("gpsStatus");

if (!navigator.geolocation) {

alert("Tento telefon nebo prohlížeč nepodporuje zjištění polohy.");

return;

}

gpsStatus.innerText = "📍 Zjišťuji vaši aktuální polohu...";

navigator.geolocation.getCurrentPosition(

function(position) {

const latitude = position.coords.latitude;

const longitude = position.coords.longitude;

const mapa =

"https://www.google.com/maps?q="

+ latitude

+ ","

+ longitude;

fromInput.value = mapa;

gpsStatus.innerText =

"✅ Poloha načtena – můžete odeslat objednávku.";

},

function(error) {

gpsStatus.innerText =

"❌ Poloha nebyla načtena.";

if (error.code === 1) {

alert(

"Přístup k poloze byl zamítnut. " +

"Povolte prosím přístup k poloze pro tento web."

);

}

else if (error.code === 2) {

alert(

"Poloha není momentálně dostupná. " +

"Zkontrolujte GPS a zkuste to znovu."

);

}

else {

alert(

"Poloha se nepodařila načíst. " +

"Zkuste to prosím znovu."

);

}

}

);

}

</script>

<script>
  var deferredPrompt;
  var banner = document.getElementById('universal-banner');
  var btn = document.getElementById('universal-btn');

  // Skryje banner, pokud už je web nainstalovaný
  var isStandalone = window.navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if (isStandalone && banner) {
    banner.style.display = 'none';
  }

  // Zachycení automatické instalace pro Android Chrome
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    deferredPrompt = e;
  });

  // Logika po kliknutí na tlačítko "Stáhnout"
  if (btn) {
    btn.addEventListener('click', function() {
      var ua = navigator.userAgent || navigator.vendor || window.opera || '';
      var isFB = (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1) || (ua.indexOf("Instagram") > -1);
      var isiOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

      // 1. Facebook / Instagram / Messenger prohlížeč
      if (isFB) {
        alert("Otevíráte web z aplikací Facebook nebo Instagram.\n\nPro uložení na plochu:\n1. Klikněte na 3 tečky (vpravo nahoře nebo dole)\n2. Zvolte 'Otevřít v prohlížeči' (Safari / Chrome)\n3. Následně přidejte aplikaci na plochu.");
        return;
      }

      // 2. Novější Android (automatické stažení)
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function(choiceResult) {
          if (choiceResult.outcome === 'accepted' && banner) {
            banner.style.display = 'none';
          }
          deferredPrompt = null;
        });
        return;
      }

      // 3. iPhone / iPad (Safari)
      if (isiOS) {
        alert("Pro uložení na iPhonu:\n\n1. Dole klepněte na tlačítko Sdílet ⎋\n2. Sjeďte níže a zvolte 'Přidat na plochu' ➕");
        return;
      }

      // 4. Starší Androidy, čtečky a ostatní zařízení
      alert("Pro uložení na plochu:\n\n1. Vpravo nahoře klepněte na tlačítko menu (3 tečky ⋮ nebo linky)\n2. Zvolte 'Přidat na plochu', 'Nainstalovat' nebo 'Uložit záložku'");
    });
  }

  // Registrace Service Workeru
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function(err) {
      console.log('SW chyba:', err);
    });
  }

<!-- Načtení mapových knihoven a Firebase -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<script>
  let userLat = null;
  let userLng = null;

  // Vytvoření okná pro mapu na stránce
  let mapDiv = document.getElementById('map');
  if (!mapDiv) {
    const cardMap = document.createElement('div');
    cardMap.style.cssText = "background: #1e1e1e; padding: 15px; border-radius: 12px; margin-top: 25px; border: 1px solid #f5c518;";
    cardMap.innerHTML = `
      <h3 style="margin: 0 0 5px 0; color: #f5c518; text-align: center;">Živé sledování příjezdu</h3>
      <div style="font-size: 1.1em; font-weight: bold; margin-bottom: 12px; text-align: center;">
        Čas příjezdu: <span id="eta-time" style="color: #f5c518;">-- min</span>
      </div>
      <div id="map" style="width: 100%; height: 280px; border-radius: 8px; background: #333;"></div>
    `;
    const wrap = document.querySelector('.wrap') || document.body;
    wrap.appendChild(cardMap);
  }

  // Inicializace mapy
  const map = L.map('map').setView([50.355, 15.921], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);

  // Inicializace Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyDl3iTvQd1FWFE2ilnOQ7x4g8mHdLusB_U",
    authDomain: "taxi-f5229.firebaseapp.com",
    databaseURL: "https://taxi-f5229-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "taxi-f5229",
    storageBucket: "taxi-f5229.firebasestorage.app",
    messagingSenderId: "159233844154",
    appId: "1:159233844154:web:d876460899792fde5bf383"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.database();

  const taxiIcon = L.icon({
    iconUrl: 'https://cdn-icons-png.flaticon.com/512/3448/3448339.png',
    iconSize: [35, 35],
    iconAnchor: [17, 17]
  });

  let taxiMarker = null;

  db.ref('traccar').on('value', (snapshot) => {
    const data = snapshot.val();
    const etaElement = document.getElementById('eta-time');

    if (!data) {
      if (etaElement) etaElement.innerText = "Mimo provoz";
      if (taxiMarker) { map.removeLayer(taxiMarker); taxiMarker = null; }
      return;
    }

    const lat = parseFloat(data.lat || (data.location && data.location.lat));
    const lng = parseFloat(data.lon || data.lng || (data.location && data.location.lng));
    const lastUpdate = data.timestamp || (data.location && data.location.timestamp) || Date.now();

    const minutesOld = (Date.now() - lastUpdate) / 1000 / 60;
    if (minutesOld > 3 || isNaN(lat) || isNaN(lng)) {
      if (etaElement) etaElement.innerText = "Mimo provoz";
      if (taxiMarker) { map.removeLayer(taxiMarker); taxiMarker = null; }
      return;
    }

    if (!taxiMarker) {
      taxiMarker = L.marker([lat, lng], { icon: taxiIcon }).addTo(map).bindPopup("Taxi Martin");
    } else {
      taxiMarker.setLatLng([lat, lng]);
    }

    if (typeof userLat !== 'undefined' && userLat !== null && typeof userLng !== 'undefined' && userLng !== null) {
      const bounds = L.latLngBounds([[lat, lng], [userLat, userLng]]);
      map.fitBounds(bounds, { padding: [40, 40] });
      calculateETA(lat, lng, userLat, userLng);
    } else {
      map.setView([lat, lng], 14);
    }
  });

  async function calculateETA(driverLat, driverLng, destLat, destLng) {
    try {
      const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${driverLng},${driverLat};${destLng},${destLat}?overview=false`);
      const routeData = await res.json();
      if (routeData.routes && routeData.routes[0]) {
        const minutes = Math.ceil(routeData.routes[0].duration / 60);
        const etaElement = document.getElementById('eta-time');
        if (etaElement) {
          etaElement.innerText = `${minutes} min`;
        }
      }
    } catch (e) {
      console.log("Chyba při výpočtu času:", e);
    }
  }
</script>
