<div class="wrap">

<hr style="border: 0; border-top: 1px solid #444; margin: 25px 0;">

<h3>Online Objednávka</h3>

<form action="https://formsubmit.co/jaroslavvachaonline@gmail.com" method="POST">

<script>

function ziskatPolohu() {

const fromInput = document.getElementById("from");

const gpsStatus = document.getElementById("gpsStatus");

if (!navigator.geolocation) {

alert("Tento telefon nebo prohlížeč nepodporuje zjištění polohy.");

return;

}

gpsStatus.innerText = "📍 Zjišťuji vaši aktuální polohu...";

navigator.geolocation.getCurrentPosition(

function(position) {

const latitude = position.coords.latitude;

const longitude = position.coords.longitude;

const mapa =

"https://www.google.com/maps?q="

+ latitude

+ ","

+ longitude;

fromInput.value = mapa;

gpsStatus.innerText =

"✅ Poloha načtena – můžete odeslat objednávku.";

},

function(error) {

gpsStatus.innerText =

"❌ Poloha nebyla načtena.";

if (error.code === 1) {

alert(

"Přístup k poloze byl zamítnut. " +

"Povolte prosím přístup k poloze pro tento web."

);

}

else if (error.code === 2) {

alert(

"Poloha není momentálně dostupná. " +

"Zkontrolujte GPS a zkuste to znovu."

);

}

else {

alert(

"Poloha se nepodařila načíst. " +

"Zkuste to prosím znovu."

);

}

}

);

}

</script> 
<!-- Univerzální instalační banner -->
<div id="universal-banner" style="position: fixed; bottom: 20px; left: 5%; right: 5%; background: #28a745; color: white; padding: 15px; border-radius: 12px; font-family: sans-serif; box-shadow: 0 4px 20px rgba(0,0,0,0.4); z-index: 9999; display: flex; align-items: center; justify-content: space-between;">
  <span style="font-size: 14px; font-weight: bold; padding-right: 10px;">Nainstalujte si aplikaci Taxi Martin na plochu!</span>
  <button id="universal-btn" style="background: white; color: #28a745; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; white-space: nowrap;">Stáhnout</button>
</div>

<script>
  var deferredPrompt;
  var banner = document.getElementById('universal-banner');
  var btn = document.getElementById('universal-btn');

  // Skryje banner, pokud už je web nainstalovaný
  var isStandalone = window.navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if (isStandalone && banner) {
    banner.style.display = 'none';
  }

  // Zachycení automatické instalace pro Android Chrome
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    deferredPrompt = e;
  });

  // Logika po kliknutí na tlačítko "Stáhnout"
  if (btn) {
    btn.addEventListener('click', function() {
      var ua = navigator.userAgent || navigator.vendor || window.opera || '';
      var isFB = (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1) || (ua.indexOf("Instagram") > -1);
      var isiOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

      // 1. Facebook / Instagram / Messenger prohlížeč
      if (isFB) {
        alert("Otevíráte web z aplikací Facebook nebo Instagram.\n\nPro uložení na plochu:\n1. Klikněte na 3 tečky (vpravo nahoře nebo dole)\n2. Zvolte 'Otevřít v prohlížeči' (Safari / Chrome)\n3. Následně přidejte aplikaci na plochu.");
        return;
      }

      // 2. Novější Android (automatické stažení)
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function(choiceResult) {
          if (choiceResult.outcome === 'accepted' && banner) {
            banner.style.display = 'none';
          }
          deferredPrompt = null;
        });
        return;
      }

      // 3. iPhone / iPad (Safari)
      if (isiOS) {
        alert("Pro uložení na iPhonu:\n\n1. Dole klepněte na tlačítko Sdílet ⎋\n2. Sjeďte níže a zvolte 'Přidat na plochu' ➕");
        return;
      }

      // 4. Starší Androidy, čtečky a ostatní zařízení
      alert("Pro uložení na plochu:\n\n1. Vpravo nahoře klepněte na tlačítko menu (3 tečky ⋮ nebo linky)\n2. Zvolte 'Přidat na plochu', 'Nainstalovat' nebo 'Uložit záložku'");
    });
  }

  // Registrace Service Workeru
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function(err) {
      console.log('SW chyba:', err);
    });
  }
</script>
<!-- === ZAČÁTEK MAPY A SLEDOVÁNÍ TAXI === -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<div style="background: #111111; color: #ffffff; padding: 20px; border-radius: 16px; margin: 25px auto; max-width: 500px; text-align: center; border: 2px solid #ffcc00; font-family: system-ui, -apple-system, sans-serif; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
  <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px;">
    <span style="font-size: 24px;">🚖</span>
    <h3 style="margin: 0; color: #ffcc00; font-size: 20px;">Živé sledování vozu</h3>
  </div>
  
  <div id="status" style="font-size: 15px; font-weight: bold; margin-bottom: 15px; color: #aaa; background: #222; padding: 8px 14px; border-radius: 20px; display: inline-block;">
    Načítám polohu...
  </div>

  <div id="map" style="width: 100%; height: 320px; border-radius: 12px; border: 1px solid #333;"></div>
</div>

<script>
  // Konfigurace Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyDl3iTvQd1FWFE2ilnOQ7x4g8mHdLusB_U",
    authDomain: "taxi-f5229.firebaseapp.com",
    databaseURL: "https://taxi-f5229-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "taxi-f5229",
    storageBucket: "taxi-f5229.firebasestorage.app",
    messagingSenderId: "159233844154",
    appId: "1:159233844154:web:d876460899792fde5bf383"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.database();

  // Inicializace mapy
  const map = L.map('map').setView([50.355, 15.921], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);

  // Vlastní ikona žlutého taxíku
  const taxiIcon = L.icon({
    iconUrl: 'https://cdn-icons-png.flaticon.com/512/1048/1048313.png',
    iconSize: [42, 42],
    iconAnchor: [21, 21]
  });

  let driverMarker = null;

  // Sledování polohy z Firebase v reálném čase
  db.ref('driver/location').on('value', (snapshot) => {
    const data = snapshot.val();
    const statusEl = document.getElementById('status');

    if (data && data.lat && data.lng) {
      const { lat, lng } = data;

      if (!driverMarker) {
        driverMarker = L.marker([lat, lng], { icon: taxiIcon }).addTo(map);
      } else {
        driverMarker.setLatLng([lat, lng]);
      }
      
      map.setView([lat, lng], 14);
      statusEl.innerText = "🟢 Vůz je v provozu";
      statusEl.style.color = "#00ff66";
      statusEl.style.border = "1px solid #00ff66";
    } else {
      statusEl.innerText = "🔴 Vůz je mimo provoz";
      statusEl.style.color = "#ff4444";
      statusEl.style.border = "1px solid #ff4444";
    }
  });
</script>
