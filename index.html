<style>

color: #ccc;

}

.btn-call {

background: #28a745;

color: white;

text-decoration: none;

<body>

<div class="wrap">

<h1>🚖 Taxi Martin</h1>

<p>Rychlá a spolehlivá doprava</p>

<a href="tel:777020281" class="btn-call">

📞 Zavolat Taxi Martin<br>

(777 020 281)

</a>

<hr style="border: 0; border-top: 1px solid #444; margin: 25px 0;">

<h3>Online Objednávka</h3>

<form action="https://formsubmit.co/jaroslavvachaonline@gmail.com" method="POST">

<input type="hidden" name="_subject" value="Nová objednávka Taxi Martin!">

<input type="hidden" name="_captcha" value="false">

<label for="name">

Jméno a příjmení:

</label>

<input

type="text"

id="name"

required

>

<label for="phone">

<input

id="phone"

name="Telefon"

placeholder="Např. 777 020 281"

required

>

<label for="from">

Odkud (adresa / místo):

</label>

<input

type="text"

id="from"

name="Odkud"

placeholder="Ulice, město nebo např. Hlavní nádraží"

required

>

<button

type="button"

class="btn-location"

onclick="ziskatPolohu()">

📍 Použít moji aktuální polohu

</button>

Poloha zatím nebyla načtena.

</div>

<label for="to">

Kam (cílová adresa):

</label>

<input

type="text"

required

>

<label for="time">

Čas přistavení:

</label>

<input

type="text"

id="time"

name="Cas_pristaveni"

placeholder="Co nejdříve / přesný čas"

required

>

<button type="submit">

Odeslat objednávku

</button>

</form>

</div>

<script>

function ziskatPolohu() {

const fromInput = document.getElementById("from");

const gpsStatus = document.getElementById("gpsStatus");

if (!navigator.geolocation) {

alert("Tento telefon nebo prohlížeč nepodporuje zjištění polohy.");

return;

}

gpsStatus.innerText = "📍 Zjišťuji vaši aktuální polohu...";

navigator.geolocation.getCurrentPosition(

function(position) {

const latitude = position.coords.latitude;

const longitude = position.coords.longitude;

const mapa =

"https://www.google.com/maps?q="

+ latitude

+ ","

+ longitude;

fromInput.value = mapa;

gpsStatus.innerText =

"✅ Poloha načtena – můžete odeslat objednávku.";

},

function(error) {

gpsStatus.innerText =

"❌ Poloha nebyla načtena.";

if (error.code === 1) {

alert(

"Přístup k poloze byl zamítnut. " +

"Povolte prosím přístup k poloze pro tento web."

);

}

else if (error.code === 2) {

alert(

"Poloha není momentálně dostupná. " +

"Zkontrolujte GPS a zkuste to znovu."

);

}

else {

alert(

"Poloha se nepodařila načíst. " +

"Zkuste to prosím znovu."

);

}

}

);

}

</script> 
<!-- Univerzální instalační banner -->
<div id="universal-banner" style="position: fixed; bottom: 20px; left: 5%; right: 5%; background: #28a745; color: white; padding: 15px; border-radius: 12px; font-family: sans-serif; box-shadow: 0 4px 20px rgba(0,0,0,0.4); z-index: 9999; display: flex; align-items: center; justify-content: space-between;">
  <span style="font-size: 14px; font-weight: bold; padding-right: 10px;">Nainstalujte si aplikaci Taxi Martin na plochu!</span>
  <button id="universal-btn" style="background: white; color: #28a745; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; white-space: nowrap;">Stáhnout</button>
</div>

<script>
  let deferredPrompt;
  const banner = document.getElementById('universal-banner');
  const btn = document.getElementById('universal-btn');

  // Skryje banner, pokud už je web nainstalovaný na ploše
  const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
  if (isStandalone && banner) {
    banner.style.display = 'none';
  }

  // Zachycení automatické instalace pro Android Chrome
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
  });

  // Logika po kliknutí na tlačítko "Stáhnout"
  if (btn) {
    btn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
        if (outcome === 'accepted' && banner) banner.style.display = 'none';
      } 
      else if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
        alert("Pro uložení na iPhonu:\n\n1. Dole klepněte na tlačítko Sdílet ⎋\n2. Zvolte 'Přidat na plochu ➕'");
      } 
      else {
        alert("Pro instalaci aplikace:\n\nKlepněte nahoře na 3 tečky (⋮) a zvolte 'Otevřít v aplikaci Chrome' nebo 'Přidat na plochu'.");
      }
    });
  }

  // Registrace Service Workeru
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>




</body>
