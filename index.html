<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taxi Martin</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="IMG_2858.jpeg">

<style>
body {
  font-family: Arial, sans-serif;
  background: #111;
  color: #fff;
  margin: 0;
  padding: 20px;
  text-align: center;
}
.wrap {
  max-width: 500px;
  margin: 0 auto;
  background: #222;
  padding: 20px;
  border-radius: 12px;
}
h1 {
  color: #f5c518;
  margin-bottom: 5px;
}
p {
  font-size: 1.1em;
  color: #ccc;
}
.btn-call {
  display: block;
  background: #28a745;
  color: white;
  text-decoration: none;
  padding: 15px;
  font-size: 1.3em;
  font-weight: bold;
  border-radius: 8px;
  margin: 20px 0;
}
.btn-call:hover {
  background: #218838;
}
form {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 20px;
  text-align: left;
}
label {
  font-size: 0.9em;
  color: #aaa;
}
input, select {
  padding: 12px;
  border-radius: 6px;
  border: 1px solid #444;
  background: #333;
  color: #fff;
  font-size: 1em;
  width: 100%;
  box-sizing: border-box;
}
button {
  background: #f5c518;
  color: #000;
  font-weight: bold;
  padding: 14px;
  border: none;
  border-radius: 6px;
  font-size: 1.1em;
  cursor: pointer;
  margin-top: 10px;
}
button:hover {
  background: #e0b000;
}
.btn-location {
  background: #28a745;
  color: white;
  font-weight: bold;
  padding: 12px;
  border: none;
  border-radius: 6px;
  font-size: 1em;
  cursor: pointer;
  margin-top: 0;
}
.btn-location:hover {
  background: #218838;
}
#gpsStatus {
  font-size: 0.9em;
  color: #aaa;
  text-align: center;
  margin-top: -5px;
}
.car-marker {
  font-size: 38px;
  text-align: center;
  line-height: 1;
  filter: drop-shadow(0px 3px 5px rgba(0,0,0,0.6));
}
</style>
</head>
<body>

<div class="wrap">
  <h1>🚖 Taxi Martin</h1>
  <p>Rychlá a spolehlivá doprava</p>
  <a href="tel:777020281" class="btn-call">
    📞 Zavolat Taxi Martin<br>(777 020 281)
  </a>

  <hr style="border: 0; border-top: 1px solid #444; margin: 25px 0;">

  <h3>Online Objednávka</h3>

  <form action="https://formsubmit.co/jaroslavvachaonline@gmail.com" method="POST">
    <input type="hidden" name="_subject" value="Nová objednávka Taxi Martin!">
    <input type="hidden" name="_captcha" value="false">

    <label for="name">Jméno a příjmení:</label>
    <input type="text" id="name" name="Jmeno" placeholder="Vaše jméno" required>

    <label for="phone">Telefonní číslo:</label>
    <input type="tel" id="phone" name="Telefon" placeholder="Např. 777 020 281" required>

    <label for="from">Odkud (adresa / místo):</label>
    <input type="text" id="from" name="Odkud" placeholder="Ulice, město nebo např. Hlavní nádraží" required>

    <button type="button" class="btn-location" onclick="ziskatPolohu()">
      📍 Použít moji aktuální polohu
    </button>
    <div id="gpsStatus">Poloha zatím nebyla načtena.</div>

    <label for="to">Kam (cílová adresa):</label>
    <input type="text" id="to" name="Kam" placeholder="Cílová adresa" required>

    <label for="time">Čas přistavení:</label>
    <input type="text" id="time" name="Cas_pristaveni" placeholder="Co nejdříve / přesný čas" required>

    <button type="submit">Odeslat objednávku</button>
  </form>

  <!-- Karta s informacemi o času příjezdu -->
  <div style="background: #2a2a2a; padding: 20px; border-radius: 14px; margin-top: 25px; text-align: center;">
    <h3 style="margin: 0 0 8px 0; color: #f5c518; font-size: 1.3em;">Živé sledování příjezdu</h3>
    <div style="font-size: 1.3em; font-weight: bold;">
      Čas příjezdu: <span id="eta-time" style="color: #f5c518;">-- min</span>
    </div>
  </div>

  <!-- Mapa -->
  <div id="map" style="width: 100%; height: 350px; border-radius: 14px; margin-top: 15px; background: #333;"></div>
</div>

<script>
let userLat = null;
let userLng = null;

function ziskatPolohu() {
  const fromInput = document.getElementById("from");
  const gpsStatus = document.getElementById("gpsStatus");

  if (!navigator.geolocation) {
    alert("Tento telefon nebo prohlížeč nepodporuje zjištění polohy.");
    return;
  }

  gpsStatus.innerText = "📍 Zjišťuji vaši aktuální polohu...";
  navigator.geolocation.getCurrentPosition(
    function(position) {
      userLat = position.coords.latitude;
      userLng = position.coords.longitude;
      const mapa = "https://www.google.com/maps?q=" + userLat + "," + userLng;
      fromInput.value = mapa;
      gpsStatus.innerText = "✅ Poloha načtena – můžete odeslat objednávku.";
    },
    function(error) {
      gpsStatus.innerText = "❌ Poloha nebyla načtena.";
      alert("Nepodařilo se načíst polohu.");
    }
  );
}
</script>

<!-- Banner pro instalaci aplikace -->
<div id="universal-banner" style="position: fixed; bottom: 20px; left: 5%; right: 5%; background: #28a745; color: white; padding: 12px 15px; border-radius: 12px; font-family: sans-serif; box-shadow: 0 4px 20px rgba(0,0,0,0.5); z-index: 9999; display: flex; align-items: center; justify-content: space-between;">
  <span style="font-size: 13px; font-weight: bold; padding-right: 8px;">Nainstalujte si aplikaci Taxi Martin na plochu!</span>
  <div style="display: flex; gap: 8px; align-items: center;">
    <button id="universal-btn" style="background: white; color: #28a745; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; white-space: nowrap;">Stáhnout</button>
    <button onclick="document.getElementById('universal-banner').style.display='none'" style="background: transparent; color: white; border: none; font-size: 18px; font-weight: bold; cursor: pointer; padding: 0 5px;">✕</button>
  </div>
</div>

<div id="installModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10000; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box;">
  <div style="background: #222; border: 2px solid #f5c518; border-radius: 12px; padding: 20px; max-width: 400px; text-align: left; color: #fff; position: relative;">
    <button onclick="document.getElementById('installModal').style.display='none'" style="position: absolute; top: 10px; right: 15px; background: none; border: none; color: #aaa; font-size: 24px; cursor: pointer;">✕</button>
    <h3 style="margin-top:0; color:#f5c518;" id="modalTitle">Jak přidat aplikaci na plochu</h3>
    <div id="modalBody" style="font-size:0.95em; line-height:1.5;"></div>
    <button onclick="document.getElementById('installModal').style.display='none'" style="width:100%; margin-top:15px; background:#28a745; color:white; padding: 10px; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">Rozumím</button>
  </div>
</div>

<script>
  var deferredPrompt;
  var banner = document.getElementById('universal-banner');
  var btn = document.getElementById('universal-btn');

  var isStandalone = window.navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if (isStandalone && banner) {
    banner.style.display = 'none';
  }

  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    deferredPrompt = e;
  });

  if (btn) {
    btn.addEventListener('click', function() {
      var ua = navigator.userAgent || navigator.vendor || window.opera || '';
      var isFB = (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1) || (ua.indexOf("Instagram") > -1);
      var isiOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

      if (isFB) {
        document.getElementById('modalTitle').innerText = "Otevíráte web z Facebooku";
        document.getElementById('modalBody').innerHTML = "<ol style='padding-left:20px;'><li>Klepněte na <b>3 tečky (...)</b> vpravo nahoře nebo dole.</li><li>Zvolte <b>'Otevřít v prohlížeči Safari / Chrome'</b>.</li><li>Následně stiskněte tlačítko Stáhnout znovu.</li></ol>";
        document.getElementById('installModal').style.display = 'flex';
        return;
      }

      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function(choiceResult) {
          if (choiceResult.outcome === 'accepted' && banner) {
            banner.style.display = 'none';
          }
          deferredPrompt = null;
        });
        return;
      }

      if (isiOS) {
        document.getElementById('modalTitle').innerText = "Přidat na plochu iPhonu";
        document.getElementById('modalBody').innerHTML = "<ol style='padding-left:20px;'><li>Dole na liště Safari klepněte na tlačítko <b>Sdílet ⎋</b>.</li><li>Sjeďte v nabídce níže a zvolte <b>Přidat na plochu ➕</b>.</li><li>Potvrďte klepnutím na <b>Přidat</b> vpravo nahoře.</li></ol>";
        document.getElementById('installModal').style.display = 'flex';
        return;
      }

      document.getElementById('modalTitle').innerText = "Přidat na plochu";
      document.getElementById('modalBody').innerHTML = "<ol style='padding-left:20px;'><li>Klepněte na <b>menu prohlížeče (3 tečky ⋮)</b> vpravo nahoře.</li><li>Zvolte <b>'Přidat na plochu'</b> nebo <b>'Nainstalovat aplikaci'</b>.</li></ol>";
      document.getElementById('installModal').style.display = 'flex';
    });
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function(err) {
      console.log('SW chyba:', err);
    });
  }
</script>

<!-- Načtení mapy a Firebase -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<script>
  const map = L.map('map').setView([50.355, 15.921], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);

  const firebaseConfig = {
    apiKey: "AIzaSyDl3iTvQd1FWFE2ilnOQ7x4g8mHdLusB_U",
    authDomain: "taxi-f5229.firebaseapp.com",
    databaseURL: "https://taxi-f5229-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "taxi-f5229",
    storageBucket: "taxi-f5229.firebasestorage.app",
    messagingSenderId: "159233844154",
    appId: "1:159233844154:web:d876460899792fde5bf383"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.database();

  // ŽLUTÝ TAXÍK 🚕
  const taxiIcon = L.divIcon({
    html: '<div class="car-marker">🚕</div>',
    className: '',
    iconSize: [40, 40],
    iconAnchor: [20, 20],
    popupAnchor: [0, -20]
  });

  let taxiMarker = null;
  let animationInterval = null;

  function animateMarker(marker, startPos, endPos, duration) {
    if (animationInterval) clearInterval(animationInterval);
    const startTime = performance.now();
    
    animationInterval = setInterval(() => {
      const elapsed = performance.now() - startTime;
      const progress = Math.min(elapsed / duration, 1);
      
      const currentLat = startPos.lat + (endPos.lat - startPos.lat) * progress;
      const currentLng = startPos.lng + (endPos.lng - startPos.lng) * progress;
      
      marker.setLatLng([currentLat, currentLng]);
      
      if (progress >= 1) {
        clearInterval(animationInterval);
      }
    }, 16);
  }

  // Funkce, která spolehlivě projde celou databázi a najde NEJNOVĚJŠÍ zprávu podle času
  function getLatestLocation(rootObj) {
    let latest = null;

    function walk(node) {
      if (!node || typeof node !== 'object') return;

      const lat = parseFloat(node.lat || node.latitude);
      const lng = parseFloat(node.lon || node.lng || node.longitude);

      if (!isNaN(lat) && !isNaN(lng)) {
        // Časové razítko (OwnTracks používá 'tst' v sekundách)
        let time = node.tst ? (node.tst * 1000) : (node.created_at || 0);
        
        if (!latest || time > latest.time) {
          latest = { lat, lng, time };
        }
      }

      for (const key in node) {
        if (typeof node[key] === 'object') {
          walk(node[key]);
        }
      }
    }

    walk(rootObj);
    return latest;
  }

  db.ref().on('value', (snapshot) => {
    const rootData = snapshot.val();
    const etaElement = document.getElementById('eta-time');

    if (!rootData) return;

    const latestLoc = getLatestLocation(rootData);
    if (!latestLoc) return;

    const newPos = { lat: latestLoc.lat, lng: latestLoc.lng };

    if (!taxiMarker) {
      taxiMarker = L.marker([latestLoc.lat, latestLoc.lng], { icon: taxiIcon }).addTo(map).bindPopup("Taxi Martin");
      map.setView([latestLoc.lat, latestLoc.lng], 15);
    } else {
      const startPos = taxiMarker.getLatLng();
      animateMarker(taxiMarker, startPos, newPos, 2000);
    }

    if (typeof userLat !== 'undefined' && userLat !== null && typeof userLng !== 'undefined' && userLng !== null) {
      const bounds = L.latLngBounds([[latestLoc.lat, latestLoc.lng], [userLat, userLng]]);
      map.fitBounds(bounds, { padding: [40, 40] });
      calculateETA(latestLoc.lat, latestLoc.lng, userLat, userLng);
    } else {
      if (etaElement) etaElement.innerText = "V provozu 🟢";
    }
  });

  async function calculateETA(driverLat, driverLng, destLat, destLng) {
    try {
      const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${driverLng},${driverLat};${destLng},${destLat}?overview=false`);
      const routeData = await res.json();
      if (routeData.routes && routeData.routes[0]) {
        const minutes = Math.ceil(routeData.routes[0].duration / 60);
        const etaElement = document.getElementById('eta-time');
        if (etaElement) {
          etaElement.innerText = `${minutes} min`;
        }
      }
    } catch (e) {
      console.log("Chyba při výpočtu času:", e);
    }
  }
</script>
</body>
</html>
