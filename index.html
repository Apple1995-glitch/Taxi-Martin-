<!DOCTYPE html>

<html lang="cs">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Taxi Martin</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="IMG_2858.jpeg">



<style>

body {

font-family: Arial, sans-serif;

background: #111;

color: #fff;

margin: 0;

padding: 20px;

text-align: center;

}

.wrap {

max-width: 500px;

margin: 0 auto;

background: #222;

padding: 20px;

border-radius: 12px;

}

h1 {

color: #f5c518;

margin-bottom: 5px;

}

p {

font-size: 1.1em;

color: #ccc;

}

.btn-call {

display: block;

background: #28a745;

color: white;

text-decoration: none;

padding: 15px;

font-size: 1.3em;

font-weight: bold;

border-radius: 8px;

margin: 20px 0;

}

.btn-call:hover {

background: #218838;

}

form {

display: flex;

flex-direction: column;

gap: 12px;

margin-top: 20px;

text-align: left;

}

label {

font-size: 0.9em;

color: #aaa;

}

input,

select {

padding: 12px;

border-radius: 6px;

border: 1px solid #444;

background: #333;

color: #fff;

font-size: 1em;

width: 100%;

box-sizing: border-box;

}

button {

background: #f5c518;

color: #000;

font-weight: bold;

padding: 14px;

border: none;

border-radius: 6px;

font-size: 1.1em;

cursor: pointer;

margin-top: 10px;

}

button:hover {

background: #e0b000;

}

.btn-location {

background: #28a745;

color: white;

font-weight: bold;

padding: 12px;

border: none;

border-radius: 6px;

font-size: 1em;

cursor: pointer;

margin-top: 0;

}

.btn-location:hover {

background: #218838;

}

#gpsStatus {

font-size: 0.9em;

color: #aaa;

text-align: center;

margin-top: -5px;

}

</style>

</head>

<body>

<div class="wrap">

<h1>🚖 Taxi Martin</h1>

<p>Rychlá a spolehlivá doprava</p>

<a href="tel:777020281" class="btn-call">

📞 Zavolat Taxi Martin<br>

(777 020 281)

</a>

<hr style="border: 0; border-top: 1px solid #444; margin: 25px 0;">

<h3>Online Objednávka</h3>

<form action="https://formsubmit.co/jaroslavvachaonline@gmail.com" method="POST">

<input type="hidden" name="_subject" value="Nová objednávka Taxi Martin!">

<input type="hidden" name="_captcha" value="false">

<label for="name">

Jméno a příjmení:

</label>

<input

type="text"

id="name"

name="Jmeno"

placeholder="Vaše jméno"

required

>

<label for="phone">

Telefonní číslo:

</label>

<input

type="tel"

id="phone"

name="Telefon"

placeholder="Např. 777 020 281"

required

>

<label for="from">

Odkud (adresa / místo):

</label>

<input

type="text"

id="from"

name="Odkud"

placeholder="Ulice, město nebo např. Hlavní nádraží"

required

>

<button

type="button"

class="btn-location"

onclick="ziskatPolohu()">

📍 Použít moji aktuální polohu

</button>

<div id="gpsStatus">

Poloha zatím nebyla načtena.

</div>

<label for="to">

Kam (cílová adresa):

</label>

<input

type="text"

id="to"

name="Kam"

placeholder="Cílová adresa"

required

>

<label for="time">

Čas přistavení:

</label>

<input

type="text"

id="time"

name="Cas_pristaveni"

placeholder="Co nejdříve / přesný čas"

required

>

<button type="submit">

Odeslat objednávku

</button>

</form>

</div>

<script>

function ziskatPolohu() {

const fromInput = document.getElementById("from");

const gpsStatus = document.getElementById("gpsStatus");

if (!navigator.geolocation) {

alert("Tento telefon nebo prohlížeč nepodporuje zjištění polohy.");

return;

}

gpsStatus.innerText = "📍 Zjišťuji vaši aktuální polohu...";

navigator.geolocation.getCurrentPosition(

function(position) {

const latitude = position.coords.latitude;

const longitude = position.coords.longitude;

const mapa =

"https://www.google.com/maps?q="

+ latitude

+ ","

+ longitude;

fromInput.value = mapa;

gpsStatus.innerText =

"✅ Poloha načtena – můžete odeslat objednávku.";

},

function(error) {

gpsStatus.innerText =

"❌ Poloha nebyla načtena.";

if (error.code === 1) {

alert(

"Přístup k poloze byl zamítnut. " +

"Povolte prosím přístup k poloze pro tento web."

);

}

else if (error.code === 2) {

alert(

"Poloha není momentálně dostupná. " +

"Zkontrolujte GPS a zkuste to znovu."

);

}

else {

alert(

"Poloha se nepodařila načíst. " +

"Zkuste to prosím znovu."

);

}

}

);

}

</script> 
<!-- Univerzální instalační banner -->
<div id="universal-banner" style="position: fixed; bottom: 20px; left: 5%; right: 5%; background: #28a745; color: white; padding: 15px; border-radius: 12px; font-family: sans-serif; box-shadow: 0 4px 20px rgba(0,0,0,0.4); z-index: 9999; display: flex; align-items: center; justify-content: space-between;">
  <span style="font-size: 14px; font-weight: bold; padding-right: 10px;">Nainstalujte si aplikaci Taxi Martin na plochu!</span>
  <button id="universal-btn" style="background: white; color: #28a745; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; white-space: nowrap;">Stáhnout</button>
</div>

<script>
  var deferredPrompt;
  var banner = document.getElementById('universal-banner');
  var btn = document.getElementById('universal-btn');

  // Skryje banner, pokud už je web nainstalovaný
  var isStandalone = window.navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if (isStandalone && banner) {
    banner.style.display = 'none';
  }

  // Zachycení automatické instalace pro Android Chrome
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    deferredPrompt = e;
  });

  // Logika po kliknutí na tlačítko "Stáhnout"
  if (btn) {
    btn.addEventListener('click', function() {
      var ua = navigator.userAgent || navigator.vendor || window.opera || '';
      var isFB = (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1) || (ua.indexOf("Instagram") > -1);
      var isiOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

      // 1. Facebook / Instagram / Messenger prohlížeč
      if (isFB) {
        alert("Otevíráte web z aplikací Facebook nebo Instagram.\n\nPro uložení na plochu:\n1. Klikněte na 3 tečky (vpravo nahoře nebo dole)\n2. Zvolte 'Otevřít v prohlížeči' (Safari / Chrome)\n3. Následně přidejte aplikaci na plochu.");
        return;
      }

      // 2. Novější Android (automatické stažení)
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function(choiceResult) {
          if (choiceResult.outcome === 'accepted' && banner) {
            banner.style.display = 'none';
          }
          deferredPrompt = null;
        });
        return;
      }

      // 3. iPhone / iPad (Safari)
      if (isiOS) {
        alert("Pro uložení na iPhonu:\n\n1. Dole klepněte na tlačítko Sdílet ⎋\n2. Sjeďte níže a zvolte 'Přidat na plochu' ➕");
        return;
      }

      // 4. Starší Androidy, čtečky a ostatní zařízení
      alert("Pro uložení na plochu:\n\n1. Vpravo nahoře klepněte na tlačítko menu (3 tečky ⋮ nebo linky)\n2. Zvolte 'Přidat na plochu', 'Nainstalovat' nebo 'Uložit záložku'");
    });
  }

  // Registrace Service Workeru
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function(err) {
      console.log('SW chyba:', err);
    });
  }
</script>
</body>
