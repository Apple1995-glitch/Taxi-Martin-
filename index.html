<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Taxi Martin</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="IMG_2858.jpeg">

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body, html {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #121212;
  color: #fff;
}

/* Celoobrazovková mapa */
#map {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
}

/* Tlačítko pro vycentrování mapy */
.map-recenter-btn {
  position: absolute;
  right: 15px;
  bottom: 90px;
  z-index: 999;
  background: rgba(26, 26, 26, 0.9);
  border: 1px solid rgba(255,255,255,0.15);
  color: #fff;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  cursor: pointer;
}

/* Horní plovoucí lišta */
.app-header {
  position: absolute;
  top: 15px;
  left: 15px;
  right: 15px;
  z-index: 1000;
  background: rgba(26, 26, 26, 0.92);
  backdrop-filter: blur(12px);
  padding: 10px 16px;
  border-radius: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  border: 1px solid rgba(255,255,255,0.08);
}

.app-title {
  font-size: 1.1rem;
  font-weight: 800;
  color: #f5c518;
  cursor: pointer;
  user-select: none;
}

.btn-call-mini {
  background: #28a745;
  color: #fff;
  text-decoration: none;
  padding: 8px 14px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 0.85rem;
  box-shadow: 0 4px 12px rgba(40,167,69,0.3);
}

/* Spodní výsuvný panel */
.bottom-sheet {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  background: #1c1c1e;
  border-radius: 20px 20px 0 0;
  padding: 12px 18px 20px 18px;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 -8px 30px rgba(0,0,0,0.6);
  border-top: 1px solid rgba(255,255,255,0.1);
  transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
}

.bottom-sheet.collapsed {
  transform: translateY(calc(100% - 78px));
}

.sheet-handle-zone {
  width: 100%;
  padding: 4px 0 8px 0;
  cursor: pointer;
  text-align: center;
}

.sheet-handle {
  width: 36px;
  height: 4px;
  background: rgba(255,255,255,0.3);
  border-radius: 2px;
  margin: 0 auto;
}

/* Karta vozu */
.car-preview {
  background: linear-gradient(135deg, #2a2a2e 0%, #222225 100%);
  border-radius: 14px;
  padding: 10px 14px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border: 1px solid rgba(255,255,255,0.08);
  cursor: pointer;
}

.car-info {
  text-align: left;
}

.car-title {
  font-size: 1rem;
  font-weight: 800;
  color: #f5c518;
  user-select: none;
}

.car-badge {
  display: inline-block;
  background: rgba(245, 197, 24, 0.15);
  color: #f5c518;
  font-size: 0.7rem;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 4px;
  margin-top: 2px;
}

.eta-badge {
  text-align: right;
  display: flex;
  align-items: center;
  gap: 10px;
}

.eta-label {
  font-size: 0.7rem;
  color: #aaa;
}

.eta-time {
  font-size: 1.1rem;
  font-weight: 800;
  color: #f5c518;
}

.toggle-icon {
  font-size: 1rem;
  color: #8e8e93;
  transition: transform 0.3s ease;
}

.bottom-sheet.collapsed .toggle-icon {
  transform: rotate(180deg);
}

/* Formulář */
form {
  display: flex;
  flex-direction: column;
  gap: 8px;
  text-align: left;
}

.input-group label {
  font-size: 0.7rem;
  color: #8e8e93;
  margin-bottom: 3px;
  display: block;
  font-weight: 600;
}

input {
  width: 100%;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid #3a3a3c;
  background: #2c2c2e;
  color: #fff;
  font-size: 0.9rem;
  outline: none;
}

input:focus {
  border-color: #f5c518;
}

.btn-location {
  background: rgba(40, 167, 69, 0.15);
  color: #28a745;
  border: 1px solid rgba(40, 167, 69, 0.4);
  font-weight: 700;
  padding: 8px;
  border-radius: 8px;
  font-size: 0.8rem;
  cursor: pointer;
  width: 100%;
}

#gpsStatus {
  font-size: 0.7rem;
  color: #8e8e93;
  text-align: center;
}

.btn-submit {
  background: #f5c518;
  color: #000;
  font-weight: 800;
  padding: 13px;
  border: none;
  border-radius: 12px;
  font-size: 1rem;
  cursor: pointer;
  margin-top: 6px;
  box-shadow: 0 4px 15px rgba(245, 197, 24, 0.25);
}

/* PIN sekce */
#admin-panel, #driver-gps-panel {
  display: none;
  background: #121212;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 10px;
}

#admin-panel { border: 1px dashed #f5c518; }
#driver-gps-panel { border: 1px dashed #28a745; }

.btn-admin-on {
  background: #28a745;
  color: white;
  width: 100%;
  padding: 8px;
  border: none;
  border-radius: 6px;
  font-weight: bold;
  margin-bottom: 5px;
  cursor: pointer;
}

.btn-admin-off {
  background: #dc3545;
  color: white;
  width: 100%;
  padding: 8px;
  border: none;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
}

/* VÝRAZNÁ IKONA TAXÍKU S PULZUJÍCÍ ZÁŘÍ */
.taxi-marker-container {
  position: relative;
  width: 50px;
  height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.taxi-pulse {
  position: absolute;
  width: 44px;
  height: 44px;
  background: rgba(245, 197, 24, 0.4);
  border-radius: 50%;
  animation: pulse-glow 2s infinite ease-in-out;
}

@keyframes pulse-glow {
  0% { transform: scale(0.8); opacity: 0.8; }
  50% { transform: scale(1.3); opacity: 0.2; }
  100% { transform: scale(0.8); opacity: 0.8; }
}

.taxi-car-icon {
  position: relative;
  z-index: 2;
  width: 40px;
  height: 40px;
  background: #f5c518;
  border: 2px solid #000;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  box-shadow: 0 6px 16px rgba(0,0,0,0.6);
  transition: transform 0.3s ease;
}
</style>
</head>

<script>
function toggleSheet() {
  document.getElementById('bottomSheet').classList.toggle('collapsed');
}

/* CHYTRÁ DETEKCE A LOGIKA PRO INSTALACI APLIKACE (PWA) */
var deferredPrompt;
var banner = document.getElementById('universal-banner');
var btn = document.getElementById('universal-btn');

var isStandalone = window.navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
if (isStandalone && banner) {
  banner.style.display = 'none';
}

window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  deferredPrompt = e;
  if (banner && !isStandalone) {
    banner.style.display = 'flex';
  }
});

if (btn) {
  btn.addEventListener('click', function() {
    var ua = navigator.userAgent || navigator.vendor || window.opera || '';
    var isFB = (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1) || (ua.indexOf("Instagram") > -1);
    var isiOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    // 1. Detekce prohlížeče Facebook / Instagram
    if (isFB) {
      document.getElementById('modalTitle').innerText = "Otevíráte web z Facebooku / Instagramu";
      document.getElementById('modalBody').innerHTML = "<ol style='padding-left:20px; line-height:1.6;'><li>Klepněte na <b>3 tečky (...)</b> vpravo nahoře nebo dole.</li><li>Zvolte <b>'Otevřít v prohlížeči Safari'</b> (nebo Chrome).</li><li>Poté stiskněte tlačítko Stáhnout znovu.</li></ol>";
      document.getElementById('installModal').style.display = 'flex';
      return;
    }

    // 2. Přímá instalace (Android Chrome)
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function(choiceResult) {
        if (choiceResult.outcome === 'accepted' && banner) {
          banner.style.display = 'none';
        }
        deferredPrompt = null;
      });
      return;
    }

    // 3. Apple iPhone / iPad (Safari)
    if (isiOS) {
      document.getElementById('modalTitle').innerText = "Přidat na plochu iPhonu";
      document.getElementById('modalBody').innerHTML = "<ol style='padding-left:20px; line-height:1.6;'><li>Dole na liště Safari klepněte na tlačítko <b>Sdílet ⎋</b>.</li><li>Sjeďte v nabídce níže a zvolte <b>'Přidat na plochu ➕'</b>.</li><li>Potvrďte klepnutím na <b>Přidat</b> vpravo nahoře.</li></ol>";
      document.getElementById('installModal').style.display = 'flex';
      return;
    }

    // 4. Android (ostatní prohlížeče / starší verze)
    document.getElementById('modalTitle').innerText = "Přidat aplikaci na plochu";
    document.getElementById('modalBody').innerHTML = "<ol style='padding-left:20px; line-height:1.6;'><li>Klepněte na <b>menu prohlížeče (3 tečky ⋮)</b> vpravo nahoře.</li><li>Zvolte <b>'Přidat na plochu'</b> nebo <b>'Nainstalovat aplikaci'</b>.</li></ol>";
    document.getElementById('installModal').style.display = 'flex';
  });
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function(err) {
    console.log('SW chyba:', err);
  });
}

/* Uložení a načtení údajů zákazníka */
window.addEventListener('DOMContentLoaded', () => {
  if(localStorage.getItem('taxi_name')) document.getElementById('name').value = localStorage.getItem('taxi_name');
  if(localStorage.getItem('taxi_phone')) document.getElementById('phone').value = localStorage.getItem('taxi_phone');
});

function saveCustomerData() {
  localStorage.setItem('taxi_name', document.getElementById('name').value);
  localStorage.setItem('taxi_phone', document.getElementById('phone').value);
}

let userLat = null;
let userLng = null;

/* Načtení polohys - generuje přímý odkaz na Google Maps */
function ziskatPolohu() {
  const fromInput = document.getElementById("from");
  const gpsStatus = document.getElementById("gpsStatus");

  if (!navigator.geolocation) {
    alert("Tento telefon nepodporuje zjištění polohy.");
    return;
  }

  gpsStatus.innerText = "📍 Zjišťuji vaši aktuální polohu...";
  navigator.geolocation.getCurrentPosition(
    function(position) {
      userLat = position.coords.latitude;
      userLng = position.coords.longitude;
      fromInput.value = "https://www.google.com/maps?q=" + userLat + "," + userLng;
      gpsStatus.innerText = "✅ Poloha načtena.";
    },
    function(error) {
      gpsStatus.innerText = "❌ Poloha nebyla načtena.";
    }
  );
}

/* LEAFLET & FIREBASE */
const map = L.map('map', { zoomControl: false }).setView([50.355, 15.921], 15);

/* BEZPLATNÝ ZDROJ MAPY ESRI (BEZ API KLÍČE, FUNGUJE VŽDY) */
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ, TomTom, Intermap, iPC, USGS, FAO, NPS, NRCAN, GeoBase, IGN, Kadaster NL, Ordnance Survey, Esri Japan, METI, Esri China (Hong Kong), swisstopo, MapmyIndia, &copy; OpenStreetMap contributors',
  maxZoom: 18
}).addTo(map);

const firebaseConfig = {
  apiKey: "AIzaSyDl3iTvQd1FWFE2ilnOQ7x4g8mHdLusB_U",
  authDomain: "taxi-f5229.firebaseapp.com",
  databaseURL: "https://taxi-f5229-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "taxi-f5229",
  storageBucket: "taxi-f5229.firebasestorage.app",
  messagingSenderId: "159233844154",
  appId: "1:159233844154:web:d876460899792fde5bf383"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database();

db.ref('golf_active').on('value', (snapshot) => {
  const active = snapshot.val();

/* PIN KÓDY */
let adminClicks = 0;
function toggleAdminPanel() {
  adminClicks++;

      if (prompt("Zadejte PIN řidiče:") === "118564702") panel.style.display = 'block';
    } else panel.style.display = 'none';
    driverClicks = 0;
  }
  setTimeout(() => { driverClicks = 0; }, 2000);
}

/* VÝRAZNÁ IKONA TAXÍKU */
const taxiIconHtml = `
  <div class="taxi-marker-container">
    <div class="taxi-pulse"></div>
    <div id="taxi-car-body" class="taxi-car-icon">🚕</div>
  </div>
`;

const taxiCustomIcon = L.divIcon({
  html: taxiIconHtml,
  className: '',
  iconSize: [50, 50],
  iconAnchor: [25, 25]
});

let taxiMarker = null;
let currentDriverPos = null;

function centerMapOnDriver() {
  if (currentDriverPos) {
    map.flyTo([currentDriverPos.lat, currentDriverPos.lng], 16);
  }
}

function calculateBearing(startLat, startLng, destLat, destLng) {
  const startLatRad = startLat * (Math.PI / 180);
  const startLngRad = startLng * (Math.PI / 180);
  const destLatRad = destLat * (Math.PI / 180);
  const destLngRad = destLng * (Math.PI / 180);

  const y = Math.sin(destLngRad - startLngRad) * Math.cos(destLatRad);
  const x = Math.cos(startLatRad) * Math.sin(destLatRad) -
            Math.sin(startLatRad) * Math.cos(destLatRad) * Math.cos(destLngRad - startLngRad);

  return (Math.atan2(y, x) * (180 / Math.PI) + 360) % 360;
}

let animId = null;
function animateMarker(marker, startPos, endPos, duration) {
  if (animId) cancelAnimationFrame(animId);
  const startTime = performance.now();
  const angle = calculateBearing(startPos.lat, startPos.lng, endPos.lat, endPos.lng);

  const carBody = document.getElementById('taxi-car-body');
  if (carBody) carBody.style.transform = `rotate(${angle}deg)`;

  function frame(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1);

    const lat = startPos.lat + (endPos.lat - startPos.lat) * progress;
    const lng = startPos.lng + (endPos.lng - startPos.lng) * progress;

    marker.setLatLng([lat, lng]);

    if (progress < 1) animId = requestAnimationFrame(frame);
  }
  animId = requestAnimationFrame(frame);
}

function getLatestLocation(rootObj) {
  let latest = null;
  function walk(node) {
    if (!node || typeof node !== 'object') return;
    let lat = node.lat !== undefined ? node.lat : node.latitude;
    let lng = node.lon !== undefined ? node.lon : (node.lng !== undefined ? node.lng : node.longitude);
    if (lat !== undefined && lng !== undefined) {
      lat = parseFloat(lat); lng = parseFloat(lng);
      if (!isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0) {
        let time = node.timestamp || node.tst || node.time || 0;
        if (typeof time === 'number' && time < 10000000000) time *= 1000;
        if (!latest || time >= latest.time) latest = { lat, lng, time };
      }
    }
    for (const key in node) if (typeof node[key] === 'object') walk(node[key]);
  }
  walk(rootObj);
  return latest;
}

db.ref().on('value', (snapshot) => {
  const loc = getLatestLocation(snapshot.val());
  if (!loc) return;

  currentDriverPos = { lat: loc.lat, lng: loc.lng };

  if (!taxiMarker) {
    taxiMarker = L.marker([loc.lat, loc.lng], { icon: taxiCustomIcon }).addTo(map);
    map.setView([loc.lat, loc.lng], 15);
  } else {
    const startPos = taxiMarker.getLatLng();
    if (Math.abs(startPos.lat - loc.lat) > 0.000005 || Math.abs(startPos.lng - loc.lng) > 0.000005) {
      animateMarker(taxiMarker, startPos, loc, 1500);
    }
  }

  if (userLat && userLng) calculateETA(loc.lat, loc.lng, userLat, userLng);
});

async function calculateETA(driverLat, driverLng, destLat, destLng) {
  try {
    const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${driverLng},${driverLat};${destLng},${destLat}?overview=false`);
    const routeData = await res.json();
    if (routeData.routes && routeData.routes[0]) {
      const minutes = Math.ceil(routeData.routes[0].duration / 60);
      document.getElementById('eta-time').innerText = `${minutes} min`;
    }
  } catch (e) {}
}

/* PODPORA BĚHU NA POZADÍ A PŘI ZAMČENÉ OBRAZOVCE */
let wakeLock = null;
let silentAudioCtx = null;

function startBackgroundKeepAlive() {
  // 1. Zabraňuje uspání procesoru (Wake Lock API)
  if ('wakeLock' in navigator) {
    navigator.wakeLock.request('screen').then((wl) => {
      wakeLock = wl;
    }).catch((e) => console.log('Wake Lock chyba:', e));
  }

  // 2. Generuje tichý audio kanál, aby si mobil myslel, že běží PŘEHRÁVAČ HUDBY (zabraňuje vypnutí GPS)
  try {
    if (!silentAudioCtx) {
      silentAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = silentAudioCtx.createOscillator();
      const gain = silentAudioCtx.createGain();
      gain.gain.value = 0.001; // Zcela neslyšitelné
      osc.connect(gain);
      gain.connect(silentAudioCtx.destination);
      osc.start();
    } else if (silentAudioCtx.state === 'suspended') {
      silentAudioCtx.resume();
    }
  } catch (e) {
    console.log('Audio KeepAlive chyba:', e);
  }
}

function stopBackgroundKeepAlive() {
  if (wakeLock) {
    wakeLock.release().catch(() => {});
    wakeLock = null;
  }
  if (silentAudioCtx) {
    silentAudioCtx.suspend().catch(() => {});
  }
}

/* GPS VYSÍLÁNÍ ŘIDIČE (OPRAVENO PROTI CHYBĚ A PRO BĚH PŘI ZAMČENÉ OBRAZOVCE) */
let watchPositionId = null;

function toggleGpsTracking() {
  const statusDiv = document.getElementById('driver-live-status');
  const btn = document.getElementById('btn-toggle-gps');

  // Vypnutí GPS vysílání
  if (watchPositionId !== null) {
    navigator.geolocation.clearWatch(watchPositionId);
    watchPositionId = null;
    stopBackgroundKeepAlive();
    statusDiv.innerText = "GPS vysílání vypnuto";
    btn.innerText = "▶️ SPUSTIT JÍZDU (Vysílat GPS)";
    btn.className = "btn-admin-on";
    return;
  }

  if (!navigator.geolocation) {
    alert("Váš prohlížeč neobsahuje modul pro sledování GPS.");
    return;
  }

  setGolfStatus(true);
  startBackgroundKeepAlive();
  statusDiv.innerText = "⏳ Připojuji GPS...";

  function initWatch(highAccuracy) {
    if (watchPositionId !== null) {
      navigator.geolocation.clearWatch(watchPositionId);
    }

    watchPositionId = navigator.geolocation.watchPosition(
      (pos) => {
        db.ref('driver').set({ 
          lat: pos.coords.latitude, 
          lng: pos.coords.longitude, 
          timestamp: Date.now() 
        });
        statusDiv.innerText = `🟢 VYSÍLÁM GPS...`;
        btn.innerText = "⏹️ UKONČIT JÍZDU";
        btn.className = "btn-admin-off";
      },
      (err) => {
        console.warn("GPS chyba:", err);
        // Pokud dojde k timeoutu, kód se zkusí přepnout na záložní síťové zaměření
        if (err.code === err.TIMEOUT && highAccuracy) {
          statusDiv.innerText = "⚠️ Vyhledávám záložní signál...";
          initWatch(false);
        } else {
          statusDiv.innerText = "❌ Chyba GPS: " + err.message;
        }
      },
      { 
        enableHighAccuracy: highAccuracy, 
        maximumAge: 10000, 
        timeout: 30000 
      }
    );
  }

  initWatch(true);
}
