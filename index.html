<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link rel="apple-touch-icon" href="IMG_2858.jpeg">

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body, html {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #121212;
  color: #fff;
}

/* Celoobrazovková mapa */
#map {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
}

/* Horní plovoucí lišta */
.app-header {
  position: absolute;
  top: 15px;
  left: 15px;
  right: 15px;
  z-index: 1000;
  background: rgba(26, 26, 26, 0.92);
  backdrop-filter: blur(12px);
  padding: 10px 16px;
  border-radius: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  border: 1px solid rgba(255,255,255,0.08);
}

.app-title {
  font-size: 1.1rem;
  font-weight: 800;
  color: #f5c518;
  cursor: pointer;
  user-select: none;
}

.btn-call-mini {
  background: #28a745;
  color: #fff;
  text-decoration: none;
  padding: 8px 14px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 0.85rem;
  box-shadow: 0 4px 12px rgba(40,167,69,0.3);
}

/* Spodní výsuvný panel (Bottom Sheet) */
.bottom-sheet {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  background: #1c1c1e;
  border-radius: 20px 20px 0 0;
  padding: 12px 18px 20px 18px;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 -8px 30px rgba(0,0,0,0.6);
  border-top: 1px solid rgba(255,255,255,0.1);
  transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
}

/* Třída pro schovaný panel - ukáže pouze horní kartu s autem */
.bottom-sheet.collapsed {
  transform: translateY(calc(100% - 78px));
}

.sheet-handle-zone {
  width: 100%;
  padding: 4px 0 8px 0;
  cursor: pointer;
  text-align: center;
}

.sheet-handle {
  width: 36px;
  height: 4px;
  background: rgba(255,255,255,0.3);
  border-radius: 2px;
  margin: 0 auto;
}

/* Karta vozu - VW Golf VII */
.car-preview {
  background: linear-gradient(135deg, #2a2a2e 0%, #222225 100%);
  border-radius: 14px;
  padding: 10px 14px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border: 1px solid rgba(255,255,255,0.08);
  cursor: pointer;
}

.car-info {
  text-align: left;
}

.car-title {
  font-size: 1rem;
  font-weight: 800;
  color: #f5c518;
  user-select: none;
}

.car-badge {
  display: inline-block;
  background: rgba(245, 197, 24, 0.15);
  color: #f5c518;
  font-size: 0.7rem;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 4px;
  margin-top: 2px;
}

.eta-badge {
  text-align: right;
  display: flex;
  align-items: center;
  gap: 10px;
}

.eta-label {
  font-size: 0.7rem;
  color: #aaa;
}

.eta-time {
  font-size: 1.1rem;
  font-weight: 800;
  color: #f5c518;
}

.toggle-icon {
  font-size: 1rem;
  color: #8e8e93;
  transition: transform 0.3s ease;
}

.bottom-sheet.collapsed .toggle-icon {
  transform: rotate(180deg);
}

/* Formulář objednávky */
form {
  display: flex;
  flex-direction: column;
  gap: 8px;
  text-align: left;
}

.input-group label {
  font-size: 0.7rem;
  color: #8e8e93;
  margin-bottom: 3px;
  display: block;
  font-weight: 600;
}

input {
  width: 100%;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid #3a3a3c;
  background: #2c2c2e;
  color: #fff;
  font-size: 0.9rem;
  outline: none;
}

input:focus {
  border-color: #f5c518;
}

.btn-location {
  background: rgba(40, 167, 69, 0.15);
  color: #28a745;
  border: 1px solid rgba(40, 167, 69, 0.4);
  font-weight: 700;
  padding: 8px;
  border-radius: 8px;
  font-size: 0.8rem;
  cursor: pointer;
  width: 100%;
}

#gpsStatus {
  font-size: 0.7rem;
  color: #8e8e93;
  text-align: center;
}

.btn-submit {
  background: #f5c518;
  color: #000;
  font-weight: 800;
  padding: 13px;
  border: none;
  border-radius: 12px;
  font-size: 1rem;
  cursor: pointer;
  margin-top: 6px;
  box-shadow: 0 4px 15px rgba(245, 197, 24, 0.25);
}

/* PIN sekce - Správa a Řidič */
#admin-panel, #driver-gps-panel {
  display: none;
  background: #121212;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 10px;
}

#admin-panel { border: 1px dashed #f5c518; }
#driver-gps-panel { border: 1px dashed #28a745; }

.btn-admin-on {
  background: #28a745;
  color: white;
  width: 100%;
  padding: 8px;
  border: none;
  border-radius: 6px;
  font-weight: bold;
  margin-bottom: 5px;
  cursor: pointer;
}

.btn-admin-off {
  background: #dc3545;
  color: white;
  width: 100%;
  padding: 8px;
  border: none;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
}

/* Špendlík na mapě */
.pin-marker {
  font-size: 36px;
  text-align: center;
  line-height: 1;
  filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.7));
}
</style>
</head>
<body>

<!-- MAPA PŘES CELOU OBRAZOVKU -->
<div id="map"></div>

<!-- HORNÍ LIŠTA -->
<div class="app-header">
  <div class="app-title" onclick="toggleAdminPanel()">
    🚖 Taxi Martin
  </div>
  <a href="tel:777020281" class="btn-call-mini">
    📞 777 020 281
  </a>
</div>

<!-- SPODNÍ SKLÁDACÍ PANEL -->
<div class="bottom-sheet" id="bottomSheet">
  
  <!-- KLIKACÍ ZÓNA PRO SKLÁDÁNÍ / ROZBALENÍ PANELU -->
  <div class="sheet-handle-zone" onclick="toggleSheet()">
    <div class="sheet-handle"></div>
  </div>

  <!-- KARTA VOZU -->
  <div class="car-preview" onclick="toggleSheet()">
    <div class="car-info">
      <div class="car-title" onclick="event.stopPropagation(); toggleDriverPanel();">🚘 VW Golf VII</div>
      <div class="car-badge">Prémiový vůz</div>
      <div id="golf-status" style="font-size: 0.75rem; font-weight: bold; margin-top: 3px; color: #aaa;">Načítám stav...</div>
    </div>
    <div class="eta-badge">
      <div>
        <div class="eta-label">Příjezd za</div>
        <div id="eta-time" class="eta-time">-- min</div>
      </div>
      <div class="toggle-icon">▼</div>
    </div>

  <!-- SKRYTÉ PANELY PRO SPRÁVCE A ŘIDIČE -->
  <div id="admin-panel">
    <p style="margin: 0 0 8px 0; font-size: 0.8rem; color: #f5c518; font-weight: bold;">⚙️ Nastavení stavu vozidla:</p>
    <button type="button" class="btn-admin-on" onclick="setGolfStatus(true)">🟢 ZAPNOUT (V provozu)</button>
    <button type="button" class="btn-admin-off" onclick="setGolfStatus(false)">🔴 VYPNOUT (Mimo provoz)</button>

  <div id="driver-gps-panel">
    <p style="margin: 0 0 4px 0; font-size: 0.8rem; color: #28a745; font-weight: bold;">🚕 Řidič - Živé vysílání jízdy</p>

    <button type="button" id="btn-toggle-gps" class="btn-admin-on" onclick="toggleGpsTracking()">▶️ SPUSTIT JÍZDU (Vysílat GPS)</button>

  <!-- OBJEDNÁVKOVÝ FORMULÁŘ -->
  <form action="https://formsubmit.co/jaroslavvachaonline@gmail.com" method="POST">

<!-- BANNER PRO INSTALACI APLIKACE -->
<div id="universal-banner" style="position: fixed; bottom: 15px; left: 15px; right: 15px; background: #28a745; color: white; padding: 10px 14px; border-radius: 14px; font-family: sans-serif; box-shadow: 0 4px 20px rgba(0,0,0,0.5); z-index: 9999; display: flex; align-items: center; justify-content: space-between;">
  <span style="font-size: 12px; font-weight: bold; padding-right: 8px;">Nainstalujte si aplikaci na plochu!</span>
  <div style="display: flex; gap: 6px; align-items: center;">

    <div id="modalBody" style="font-size:0.9em; line-height:1.5; margin-top: 10px;"></div>
    <button type="button" onclick="document.getElementById('installModal').style.display='none'" style="width:100%; margin-top:15px; background:#28a745; color:white; padding: 12px; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">Rozumím</button>

<!-- LEAFLET & FIREBASE SCRIPTY -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<script>
/* Funkce pro skládání a rozbalení panelu */
function toggleSheet() {
  const sheet = document.getElementById('bottomSheet');
  sheet.classList.toggle('collapsed');
}

let userLat = null;
let userLng = null;

function ziskatPolohu() {
  const fromInput = document.getElementById("from");
  const gpsStatus = document.getElementById("gpsStatus");

  if (!navigator.geolocation) {
    alert("Tento telefon nebo prohlížeč nepodporuje zjištění polohy.");
    return;
  }

  gpsStatus.innerText = "📍 Zjišťuji vaši aktuální polohu...";
  navigator.geolocation.getCurrentPosition(
    function(position) {
      userLat = position.coords.latitude;
      userLng = position.coords.longitude;
      const mapa = "https://www.google.com/maps?q=" + userLat + "," + userLng;
      fromInput.value = mapa;
      gpsStatus.innerText = "✅ Poloha načtena.";
    },
    function(error) {
      gpsStatus.innerText = "❌ Poloha nebyla načtena.";
      alert("Nepodařilo se načíst polohu.");
    }
  );
}

/* BANNER INSTALACE LOGIKA */
var deferredPrompt;
var banner = document.getElementById('universal-banner');
var btn = document.getElementById('universal-btn');

var isStandalone = window.navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
if (isStandalone && banner) {
  banner.style.display = 'none';
}

window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  deferredPrompt = e;
});

if (btn) {
  btn.addEventListener('click', function() {
    var ua = navigator.userAgent || navigator.vendor || window.opera || '';
    var isFB = (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1) || (ua.indexOf("Instagram") > -1);
    var isiOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    if (isFB) {
      document.getElementById('modalTitle').innerText = "Otevíráte web z Facebooku";
      document.getElementById('modalBody').innerHTML = "<ol style='padding-left:20px;'><li>Klepněte na <b>3 tečky (...)</b> vpravo nahoře nebo dole.</li><li>Zvolte <b>'Otevřít v prohlížeči Safari / Chrome'</b>.</li><li>Následně stiskněte tlačítko Stáhnout znovu.</li></ol>";
      document.getElementById('installModal').style.display = 'flex';
      return;
    }

    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function(choiceResult) {
        if (choiceResult.outcome === 'accepted' && banner) {
          banner.style.display = 'none';
        }
        deferredPrompt = null;
      });
      return;
    }

    if (isiOS) {
      document.getElementById('modalTitle').innerText = "Přidat na plochu iPhonu";
      document.getElementById('modalBody').innerHTML = "<ol style='padding-left:20px;'><li>Dole na liště Safari klepněte na tlačítko <b>Sdílet ⎋</b>.</li><li>Sjeďte v nabídce níže a zvolte <b>Přidat na plochu ➕</b>.</li><li>Potvrďte klepnutím na <b>Přidat</b> vpravo nahoře.</li></ol>";
      document.getElementById('installModal').style.display = 'flex';
      return;
    }

    document.getElementById('modalTitle').innerText = "Přidat na plochu";
    document.getElementById('modalBody').innerHTML = "<ol style='padding-left:20px;'><li>Klepněte na <b>menu prohlížeče (3 tečky ⋮)</b> vpravo nahoře.</li><li>Zvolte <b>'Přidat na plochu'</b> nebo <b>'Nainstalovat aplikaci'</b>.</li></ol>";
    document.getElementById('installModal').style.display = 'flex';
  });
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function(err) {
    console.log('SW chyba:', err);
  });
}

/* FIREBASE A MAPOVÁ LOGIKA */
const map = L.map('map', { zoomControl: false }).setView([50.355, 15.921], 15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);

const firebaseConfig = {
  apiKey: "AIzaSyDl3iTvQd1FWFE2ilnOQ7x4g8mHdLusB_U",
  authDomain: "taxi-f5229.firebaseapp.com",
  databaseURL: "https://taxi-f5229-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "taxi-f5229",
  storageBucket: "taxi-f5229.firebasestorage.app",
  messagingSenderId: "159233844154",
  appId: "1:159233844154:web:d876460899792fde5bf383"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();

// Sledování stavu vozu
db.ref('golf_active').on('value', (snapshot) => {
  const active = snapshot.val();
  const golfStatus = document.getElementById('golf-status');

  if (active === true) {
    golfStatus.innerHTML = "<span style='color: #28a745;'>🟢 V PROVOZU</span>";
  } else {
    golfStatus.innerHTML = "<span style='color: #dc3545;'>🔴 MIMO PROVOZ</span>";
  }
});

function setGolfStatus(state) {
  db.ref('golf_active').set(state);
}

// 3x Klik na hlavním nadpisu -> Správa (PIN 1875)
let adminClicks = 0;
function toggleAdminPanel() {
  adminClicks++;
  if (adminClicks >= 3) {
    const panel = document.getElementById('admin-panel');
    if (panel.style.display !== 'block') {
      const pin = prompt("Zadejte PIN správce:");
      if (pin === "1875") {
        panel.style.display = 'block';
      } else if (pin !== null) {
        alert("Nesprávný PIN správce!");
      }
    } else {
      panel.style.display = 'none';
    }
    adminClicks = 0;
  }
  setTimeout(() => { adminClicks = 0; }, 2000);
}

// 3x Klik na auto -> Přihlášení řidiče (PIN 11856)
let driverClicks = 0;
function toggleDriverPanel() {
  driverClicks++;
  if (driverClicks >= 3) {
    const panel = document.getElementById('driver-gps-panel');
    if (panel.style.display !== 'block') {
      const pin = prompt("Zadejte PIN řidiče:");
      if (pin === "11856") {
        panel.style.display = 'block';
      } else if (pin !== null) {
        alert("Nesprávný PIN řidiče!");
      }
    } else {
      panel.style.display = 'none';
    }
    driverClicks = 0;
  }
  setTimeout(() => { driverClicks = 0; }, 2000);
}

// Udržení běhu na pozadí
let wakeLock = null;
let audioLoop = null;

async function keepAppAlive() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (err) {
    console.log('Wake Lock chyba:', err);
  }

  if (!audioLoop) {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    gain.gain.value = 0.001;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
  }
}

function stopKeepAppAlive() {
  if (wakeLock) {
    wakeLock.release().then(() => { wakeLock = null; });
  }
}

// GPS Vysílání
let watchPositionId = null;
function toggleGpsTracking() {
  const statusDiv = document.getElementById('driver-live-status');
  const btn = document.getElementById('btn-toggle-gps');

  if (watchPositionId !== null) {
    navigator.geolocation.clearWatch(watchPositionId);
    watchPositionId = null;
    stopKeepAppAlive();
    statusDiv.innerText = "GPS vysílání vypnuto";
    btn.innerText = "▶️ SPUSTIT JÍZDU (Vysílat GPS)";
    btn.className = "btn-admin-on";
    return;
  }

  if (!navigator.geolocation) {
    alert("Tento telefon nepodporuje sledování GPS.");
    return;
  }

  statusDiv.innerText = "📡 Zapínám GPS vysílání...";
  setGolfStatus(true);
  keepAppAlive();

  watchPositionId = navigator.geolocation.watchPosition(
    (pos) => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const now = Date.now();

      db.ref('driver').set({
        lat: lat,
        lng: lng,
        timestamp: now
      });

      statusDiv.innerText = `🟢 VYSÍLÁM: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
      btn.innerText = "⏹️ UKONČIT JÍZDU (Vypnout GPS)";
      btn.className = "btn-admin-off";
    },
    (err) => {
      statusDiv.innerText = "❌ Chyba GPS: " + err.message;
    },
    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 10000
    }
  );
}

// Zobrazení pozice na mapě s animací
const pinIcon = L.divIcon({
  html: '<div id="pin-emoji" class="pin-marker" style="transition: transform 0.3s ease; transform-origin: center;">📍</div>',
  className: '',
  iconSize: [40, 40],
  iconAnchor: [20, 38],
  popupAnchor: [0, -38]
});

let taxiMarker = null;
let animId = null;

function calculateBearing(startLat, startLng, destLat, destLng) {
  const startLatRad = startLat * (Math.PI / 180);
  const startLngRad = startLng * (Math.PI / 180);
  const destLatRad = destLat * (Math.PI / 180);
  const destLngRad = destLng * (Math.PI / 180);

  const y = Math.sin(destLngRad - startLngRad) * Math.cos(destLatRad);
  const x = Math.cos(startLatRad) * Math.sin(destLatRad) -
            Math.sin(startLatRad) * Math.cos(destLatRad) * Math.cos(destLngRad - startLngRad);

  const brng = Math.atan2(y, x) * (180 / Math.PI);
  return (brng + 360) % 360;
}

function animateMarker(marker, startPos, endPos, duration) {
  if (animId) cancelAnimationFrame(animId);
  const startTime = performance.now();

  const angle = calculateBearing(startPos.lat, startPos.lng, endPos.lat, endPos.lng);

  const pinEmoji = document.getElementById('pin-emoji');
  if (pinEmoji) {
    pinEmoji.style.transform = `rotate(${angle}deg)`;
  }

  function frame(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1);

    const lat = startPos.lat + (endPos.lat - startPos.lat) * progress;
    const lng = startPos.lng + (endPos.lng - startPos.lng) * progress;

    marker.setLatLng([lat, lng]);
    map.panTo([lat, lng], { animate: false });

    if (progress < 1) {
      animId = requestAnimationFrame(frame);
    }
  }
  animId = requestAnimationFrame(frame);
}

function getLatestLocation(rootObj) {
  let latest = null;

  function walk(node) {
    if (!node || typeof node !== 'object') return;

    let lat = node.lat !== undefined ? node.lat : node.latitude;
    let lng = node.lon !== undefined ? node.lon : (node.lng !== undefined ? node.lng : node.longitude);

    if (lat !== undefined && lng !== undefined) {
      lat = parseFloat(lat);
      lng = parseFloat(lng);
      if (!isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0) {
        let time = node.timestamp || node.tst || node.time || node.created_at || 0;
        if (typeof time === 'number' && time < 10000000000) {
          time = time * 1000;
        }
        if (!latest || time >= latest.time) {
          latest = { lat, lng, time };
        }
      }
    }

    for (const key in node) {
      if (typeof node[key] === 'object') {
        walk(node[key]);
      }
    }
  }

  walk(rootObj);
  return latest;
}

db.ref().on('value', (snapshot) => {
  const rootData = snapshot.val();
  const etaElement = document.getElementById('eta-time');

  if (!rootData) return;

  const loc = getLatestLocation(rootData);
  if (!loc) return;

  const newPos = { lat: loc.lat, lng: loc.lng };

  if (!taxiMarker) {
    taxiMarker = L.marker([loc.lat, loc.lng], { icon: pinIcon }).addTo(map).bindPopup("Taxi Martin");
    map.setView([loc.lat, loc.lng], 15);
  } else {
    const startPos = taxiMarker.getLatLng();
    if (Math.abs(startPos.lat - newPos.lat) > 0.000005 || Math.abs(startPos.lng - newPos.lng) > 0.000005) {
      animateMarker(taxiMarker, startPos, newPos, 1500);
    }
  }

  if (typeof userLat !== 'undefined' && userLat !== null && typeof userLng !== 'undefined' && userLng !== null) {
    calculateETA(loc.lat, loc.lng, userLat, userLng);
  } else {
    if (etaElement) etaElement.innerText = "OK";
  }
});

async function calculateETA(driverLat, driverLng, destLat, destLng) {
  try {
    const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${driverLng},${driverLat};${destLng},${destLat}?overview=false`);
    const routeData = await res.json();
    if (routeData.routes && routeData.routes[0]) {
      const minutes = Math.ceil(routeData.routes[0].duration / 60);
      const etaElement = document.getElementById('eta-time');
      if (etaElement) {
        etaElement.innerText = `${minutes} min`;
      }
    }
  } catch (e) {
    console.log("Chyba při výpočtu času:", e);
  }
}
