<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taxi Martin Jaroměř</title><style>body{margin:0;font-family:Arial,sans-serif;background:#111;color:#fff}.wrap{max-width:520px;margin:auto;padding:20px}.card{background:#fff;color:#111;border-radius:20px;padding:24px;box-shadow:0 10px 35px #0006}h1{text-align:center;margin:4px 0}.sub{text-align:center;color:#666;margin-bottom:22px}.call{display:block;text-align:center;background:#19a83b;color:#fff;padding:15px;border-radius:12px;text-decoration:none;font-weight:700;margin-bottom:18px}label{font-weight:700;display:block;margin:13px 0 6px}input,select,textarea{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccc;border-radius:10px;font-size:16px}button{width:100%;padding:16px;margin-top:18px;border:0;border-radius:12px;background:#111;color:#fff;font-size:18px;font-weight:700}.hint{text-align:center;color:#777;font-size:13px;margin-top:15px}</style></head><body><div class="wrap"><div class="card"><h1>🚕 TAXI MARTIN</h1><div class="sub">Jaroměř a okolí</div><a class="call" href="tel:+420000000000">📞 Zavolat Taxi Martin</a><form id="f"><label>Odkud</label><input id="from" required placeholder="Místo vyzvednutí"><label>Kam</label><input id="to" required placeholder="Cíl jízdy"><label>Kdy</label><select id="when"><option>Co nejdříve</option><option>Za 15 minut</option><option>Za 30 minut</option><option>Za 60 minut</option><option>Na konkrétní čas</option></select><label>Počet osob</label><select id="people"><option>1</option><option>2</option><option>3</option><option>4</option><option>5+</option></select><label>Telefon</label><input id="phone" required type="tel" placeholder="+420 ..."><label>Poznámka</label><textarea id="note" rows="3" placeholder="Např. dětská sedačka"></textarea><button>🚕 ODESLAT OBJEDNÁVKU</button></form><div class="hint">Po odeslání objednávku potvrdíme telefonicky.</div></div></div><script>const f=document.getElementById('f');f.addEventListener('submit',e=>{e.preventDefault();const x={from:from.value,to:to.value,when:when.value,people:people.value,phone:phone.value,note:note.value};const body=encodeURIComponent(`NOVÁ OBJEDNÁVKA TAXI MARTIN\nOdkud: ${x.from}\nKam: ${x.to}\nKdy: ${x.when}\nOsoby: ${x.people}\nTelefon: ${x.phone}\nPoznámka: ${x.note}`);alert('Objednávka je připravena. V ostré verzi ji napojíme přímo na telefon/e-mail Taxi Martin.');});</script></body></html>
